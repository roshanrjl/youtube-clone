version: "3.9"

services:
  server:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: server:latest
    env_file:
      - .env
    ports:
      - "5000:5000"
    networks:
      - server-network

  nginx:
    image: nginx:latest
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/NGINX/nginx.conf:ro
    depends_on:
      - server
    environment:
      NGINX_HOST: "localhost"
      NGINX_PORT: 80
    restart: always
    networks:
      - server-network

networks:
  server-network:
    driver: bridge
