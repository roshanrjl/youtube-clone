events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s ipv6=off;

    gzip on;
    gzip_types text/plain application/xml application/json text/css application/javascript;
    gzip_min_length 1000;

    upstream api_servers {
        least_conn;
        server server:5000 max_fails=3 fail_timeout=10s;
    }

    # map $http_origin $cors_allowed_origin {
    #     default "";
    #     "~^http://localhost:5173$" $http_origin;
    # }

    server {
        listen 80 default_server;
        server_name _;

        location /api/ {
            proxy_pass http://api_servers;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;

            # Always set CORS headers (only once)
            # add_header Access-Control-Allow-Origin $cors_allowed_origin always;
            # add_header Access-Control-Allow-Credentials "true" always;
            # add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            # add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization" always;
            # add_header Access-Control-Expose-Headers "Content-Length, Content-Type" always;
            # add_header Vary "Origin" always;

            # Handle preflight OPTIONS requests (without repeating headers)
            # if ($request_method = OPTIONS) {
            #     return 204;
            # }
        }
    }
}
