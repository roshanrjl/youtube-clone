events {
    worker_connections 1024;

}
http{
     # Docker's internal DNS resolver
    resolver 127.0.0.11 valid=30s ipv6=off;

    # grip compression for fast response. nginx only support for compression (sending responses) — not decompression (receiving gzip-encoded requests).
    gzip on;
    gzip_types text/plain application/xml application/json text/css application/javascript;
    grip_min_length 1000;

  
    upstream api_servers {
        least_conn;  # Distributes requests based on active connections
        server server:3000 max_fails=3 fail_timeout=10s;  # Server replicas will be auto-discovered
    }

    server{
        listen 80 default_server;
        server_name _;

        location /api/{
            limit_req zone=mylimit burst=30 nodelay;
            proxy_pass http://api_servers;
            # header for identifying the client
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;    
            proxy_set_header X-Forwarded-Proto $scheme;

            # timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;

            # Enable response caching
            proxy_cache api_cache;
            proxy_cache_valid 200 10m;
            proxy_cache_valid 404 1m;

        }
    }




}